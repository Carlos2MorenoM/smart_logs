services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  log_ingestor:
    build: ./services/log_ingestor
    container_name: log_ingestor
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: always

  anomaly_detector:
    build: ./services/anomaly_detector
    container_name: anomaly_detector
    ports:
      - "8001:8001"
    # Mounts the volume where the trained model is stored
    volumes:
      - model_artifacts:/model
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 2s
      retries: 5

  log_processor:
    build: ./services/log_processor
    container_name: log_processor
    # NOW DEPENDS ON THE NEW ANOMALY_DETECTOR SERVICE
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      anomaly_detector:
        condition: service_healthy
    restart: always

  model_trainer:
    build: ./services/anomaly_detector
    # Overrides the default command to run the training script instead of the API
    command: python train.py
    # Mounts volumes to read raw data and write the model artifact
    volumes:
      - ./data:/data
      - model_artifacts:/model
    profiles: ["setup"]

  ingestion_script:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    profiles: ["setup"]
    depends_on:
      log_ingestor:
        condition: service_started

volumes:
  es_data:
  # Volume to persist and share the trained model artifact
  model_artifacts:
